<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма оплаты</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 50px; display: flex; justify-content: center; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 300px; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; }
        button { width: 100%; padding: 12px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #218838; }
        #msg { font-weight: bold; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="box">
        <h3 style="margin-top:0; text-align:center;">Оплата заказа</h3>
        <form id="cardForm">
            <div class="group">
                <label>Номер карты</label>
                <input type="text" id="cardInput" placeholder="16 цифр" maxlength="16" required>
            </div>
            <div class="row">
                <div class="group">
                    <label>Срок (ММГГ)</label>
                    <input type="text" id="expiryInput" placeholder="1229" maxlength="4" required>
                </div>
                <div class="group">
                    <label>CVV</label>
                    <input type="password" id="cvvInput" placeholder="***" maxlength="3" required>
                </div>
            </div>
            <button type="submit">Оплатить</button>
        </form>
        <p id="msg"></p>
    </div>

    <script>
        const cardInput = document.getElementById('cardInput');
        const expiryInput = document.getElementById('expiryInput');
        const cvvInput = document.getElementById('cvvInput');
        const msg = document.getElementById('msg');

        [cardInput, expiryInput, cvvInput].forEach(input => {
            input.addEventListener('input', function (e) {
                e.target.value = e.target.value.replace(/\D/g, ''); // Фильтр только на цифры
            });
        });

        document.getElementById('cardForm').addEventListener('submit', function(event) {
            event.preventDefault();
            msg.style.color = 'black';
            msg.innerText = 'Отправка...';

            fetch('http://localhost:3000/api/save-card', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    cardNumber: cardInput.value, 
                    expiry: expiryInput.value, 
                    cvv: cvvInput.value 
                }) 
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    msg.style.color = 'green';
                    msg.innerText = 'Успешно сохранено!';
                    document.getElementById('cardForm').reset();
                } else {
                    msg.style.color = 'red';
                    msg.innerText = data.error;
                }
            })
            .catch(() => {
                msg.style.color = 'red';
                msg.innerText = 'Ошибка соединения с сервером.';
            });
        });
    </script>
</body>
</html>
